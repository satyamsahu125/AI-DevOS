version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # Persist generated projects and SQLite databases across container restarts
      - ./temp-workspace:/app/temp-workspace
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    build: .
    command: celery -A app.tasks.pipeline_task worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./temp-workspace:/app/temp-workspace
      - ./data:/app/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── R10: Optional OpenTelemetry Collector ─────────────────────────────────
  # Enable with: docker compose --profile otel up
  # Receives traces from the API/worker and exports to Jaeger (OTLP/gRPC).
  # Set OTEL_ENDPOINT=http://otel-collector:4317 in .env to activate tracing.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    profiles: ["otel"]
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Collector metrics
    restart: unless-stopped

  # ── R10: Jaeger — trace storage and UI ───────────────────────────────────
  # Open http://localhost:16686 to view traces.
  jaeger:
    image: jaegertracing/all-in-one:1.56
    profiles: ["otel"]
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # Jaeger UI
      - "14317:4317"    # OTLP gRPC (Jaeger's own receiver, not the collector's)
    restart: unless-stopped
