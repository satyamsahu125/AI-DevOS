# alembic.ini — AI DevOS database migration configuration
#
# Usage:
#   cd backend/
#   alembic upgrade head                          # migrate memory.sqlite (default)
#   AIDEVOS_MIGRATE_DB=costs     alembic upgrade head
#   AIDEVOS_MIGRATE_DB=auth      alembic upgrade head
#   AIDEVOS_MIGRATE_DB=knowledge alembic upgrade head
#   AIDEVOS_MIGRATE_DB=learning  alembic upgrade head
#   AIDEVOS_MIGRATE_DB=lessons   alembic upgrade head
#   AIDEVOS_MIGRATE_DB=fileindex alembic upgrade head
#
# The AIDEVOS_MIGRATE_DB env var selects which database to operate on.
# env.py resolves the actual file path using the same env-var logic as the
# application modules (MEMORY_DB_PATH, AUTH_DB_PATH, etc.).
#
# Stamp an existing database (already created by application boot) as up-to-date
# without re-running DDL:
#   alembic stamp head

[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
truncate_slug_length = 40

# sqlalchemy.url is overridden at runtime by env.py based on AIDEVOS_MIGRATE_DB.
# This default is only used if env.py falls back (should not happen in practice).
sqlalchemy.url = sqlite:///data/memory.sqlite

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
